<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SyriaNumbers</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

margin:0;
background:#050505;
color:white;

}


header{

background:linear-gradient(135deg,#000,#222,#000);
padding:35px 20px;
text-align:center;
border-bottom:1px solid #333;

}


header h1{

font-size:38px;
margin:0;
color:#00e5ff;

}


header p{

color:#aaa;
font-size:18px;

}



.container{

max-width:1000px;
margin:auto;
padding:20px;

}



.box{

background:#111;
border:1px solid #333;
border-radius:25px;
padding:25px;
margin-bottom:20px;
box-shadow:0 0 25px #000;

}



h2{

text-align:center;

}



.countries{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}



button{

border:0;
padding:18px;
border-radius:18px;
background:#1a1a1a;
color:white;
font-size:17px;
cursor:pointer;
border:1px solid #333;
transition:.3s;

}



button:hover{

background:#00aaff;
color:black;

}



.card{

background:#111;
border:1px solid #333;
padding:25px;
border-radius:25px;
text-align:center;
margin-top:20px;

}



.phone{

font-size:30px;
color:#00ff99;
font-weight:bold;
margin:25px;
direction:ltr;

}



.price{

color:#ffd700;
font-size:20px;

}



.buy{

width:100%;
background:#00aaff;
color:black;
margin-top:20px;

}



.footer{

text-align:center;
color:#777;
padding:30px;

}



@media(max-width:600px){

.countries{

grid-template-columns:1fr;

}

}


</style>


</head>


<body>


<header>

<h1>📱 SyriaNumbers</h1>

<p>منصة الأرقام الافتراضية</p>

</header>



<div class="container">


<div class="box">

<h2>اختر الدولة</h2>


<div class="countries">


<button onclick="showNumber('🇺🇸 أمريكا')">
🇺🇸 أمريكا
</button>


<button onclick="showNumber('🇷🇺 روسيا')">
🇷🇺 روسيا
</button>


<button onclick="showNumber('🇩🇪 ألمانيا')">
🇩🇪 ألمانيا
</button>


<button onclick="showNumber('🇸🇦 السعودية')">
🇸🇦 السعودية
</button>


<button onclick="showNumber('🇯🇴 الأردن')">
🇯🇴 الأردن
</button>


<button onclick="showNumber('🇾🇪 اليمن')">
🇾🇪 اليمن
</button>


<button onclick="showNumber('🇨🇳 الصين')">
🇨🇳 الصين
</button>


<button onclick="showNumber('🇮🇳 الهند')">
🇮🇳 الهند
</button>


<button onclick="showNumber('🇵🇰 باكستان')">
🇵🇰 باكستان
</button>


</div>

</div>



<div id="result"></div>



<div class="box">

<h3>⭐ مميزات الموقع</h3>

<p>
✔ تصميم فاخر<br>
✔ يعمل على الهاتف<br>
✔ توليد أرقام تلقائي<br>
✔ قابل للتطوير لاحقًا
</p>


</div>


</div>


<div class="footer">

© 2026 SyriaNumbers

</div>



<script>


function randomNumber(country){


let number="";


switch(country){


case "🇺🇸 أمريكا":

number="+1 "+Math.floor(2000000000+Math.random()*7000000000);

break;



case "🇷🇺 روسيا":

number="+7 "+Math.floor(1000000000+Math.random()*8000000000);

break;



case "🇩🇪 ألمانيا":

number="+49 "+Math.floor(100000000+Math.random()*900000000);

break;



case "🇸🇦 السعودية":

number="+966 5"+Math.floor(10000000+Math.random()*90000000);

break;



case "🇯🇴 الأردن":

number="+962 7"+Math.floor(10000000+Math.random()*90000000);

break;



case "🇾🇪 اليمن":

number="+967 "+Math.floor(700000000+Math.random()*200000000);

break;



case "🇨🇳 الصين":

number="+86 "+Math.floor(10000000000+Math.random()*90000000000);

break;



case "🇮🇳 الهند":

number="+91 "+Math.floor(6000000000+Math.random()*3000000000);

break;



case "🇵🇰 باكستان":

number="+92 3"+Math.floor(10000000+Math.random()*90000000);

break;


}


return number;


}




function showNumber(country){


let num=randomNumber(country);


document.getElementById("result").innerHTML=`

<div class="card">

<h2>${country}</h2>

<div class="phone">
${num}
</div>


<div class="price">
السعر: 2$
</div>


<button class="buy" onclick="showNumber('${country}')">
توليد رقم جديد
</button>


</div>

`;


}



</script>



</body>

</html>
