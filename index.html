<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SyriaNumbers</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#f2f4f8;
    color:#222;
}

header {
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
}

.container {
    max-width:900px;
    margin:auto;
    padding:20px;
}

.box {
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 5px 15px #0002;
}

button {
    width:100%;
    padding:15px;
    margin:8px 0;
    border:0;
    border-radius:12px;
    background:#111827;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.number {
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin:20px;
}

.price {
    text-align:center;
    font-size:18px;
}

</style>

</head>

<body>

<header>
<h1>📱 SyriaNumbers</h1>
<p>منصة الأرقام الافتراضية</p>
</header>


<div class="container">

<div class="box">
<h2>اختر الدولة</h2>

<button onclick="show('🇸🇾 سوريا')">
🇸🇾 سوريا
</button>

<button onclick="show('🇹🇷 تركيا')">
🇹🇷 تركيا
</button>

<button onclick="show('🇺🇸 أمريكا')">
🇺🇸 أمريكا
</button>

<button onclick="show('🇬🇧 بريطانيا')">
🇬🇧 بريطانيا
</button>

</div>


<div id="result" class="box">
اختر دولة لعرض الرقم
</div>


<div class="box">
⚠️ هذه نسخة تجريبية للموقع.
</div>


</div>


<script>

function show(country){

document.getElementById("result").innerHTML =

`
<h2>${country}</h2>

<div class="number">
+000 000 000 000
</div>

<div class="price">
السعر: 2$
</div>

<br>

<button onclick="buy()">
شراء الرقم
</button>

`;

}


function buy(){

alert("سيتم تفعيل نظام الشراء لاحقًا");

}

</script>


</body>
</html>
