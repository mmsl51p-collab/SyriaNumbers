<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SyriaNumbers</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Tajawal,sans-serif;
}

body{
margin:0;
background:#050505;
color:white;
min-height:100vh;
}


.login{

position:fixed;
width:100%;
height:100vh;
background:#050505;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;

}


.login h1{

font-size:45px;
color:#00e5ff;
text-shadow:0 0 25px #00e5ff;

}


.login input{

width:300px;
padding:15px;
margin:8px;
background:#111;
border:1px solid #333;
border-radius:15px;
color:white;
font-size:17px;

}


button{

width:100%;
padding:16px;
border-radius:18px;
border:1px solid #333;
background:#181818;
color:white;
font-size:17px;
cursor:pointer;
transition:.3s;

}


button:hover{

background:#00e5ff;
color:black;

}


.login button{

width:300px;
margin-top:10px;
background:#00e5ff;
color:black;

}



header{

padding:35px;
text-align:center;
background:linear-gradient(135deg,#000,#111,#000);

}


.logo{

font-size:42px;
color:#00e5ff;
text-shadow:0 0 20px #00e5ff;

}


.subtitle{

color:#aaa;

}


.container{

max-width:900px;
margin:auto;
padding:20px;

}


.box{

background:#101010;
border:1px solid #222;
border-radius:25px;
padding:25px;
margin-bottom:20px;

}


h2{

text-align:center;
color:#00e5ff;

}


.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}


.card{

background:#080808;
border:1px solid #333;
border-radius:25px;
padding:25px;
text-align:center;

}


.number{

font-size:32px;
color:#00ff88;
direction:ltr;

}


.code{

font-size:35px;
color:#ffd700;

}


.balance{

text-align:center;
color:#00ff88;
font-size:22px;

}


.history{

background:#151515;
padding:15px;
border-radius:15px;
margin:10px;

}


.timer{

font-size:40px;
color:#ffcc00;

}


@media(max-width:600px){

.grid{

grid-template-columns:1fr;

}

.logo{

font-size:32px;

}

}


</style>

</head>


<body>


<div class="login" id="loginPage">

<h1>
📱 SyriaNumbers
</h1>


<input id="username" placeholder="اسم المستخدم">


<input id="password" type="password" placeholder="كلمة المرور">


<button onclick="register()">
إنشاء حساب
</button>


<button onclick="login()">
دخول
</button>


</div>


<header>

<div class="logo">
📱 SyriaNumbers
</div>

<div class="subtitle">
منصة الأرقام التجريبية الذكية
</div>

</header>
<div class="container">


<div class="box" id="serviceBox">

<h2>اختر التطبيق</h2>

<div class="grid">

<button onclick="chooseService('واتساب')">
📱 واتساب
</button>


<button onclick="chooseService('تيليجرام')">
✈️ تيليجرام
</button>


<button onclick="chooseService('فيسبوك')">
📘 فيسبوك
</button>


<button onclick="chooseService('تويتر')">
🐦 تويتر
</button>

</div>

</div>




<div class="box" id="countryBox" style="display:none">

<h2>اختر الدولة</h2>


<div class="grid">


<button onclick="createNumber('🇺🇸 أمريكا')">
🇺🇸 أمريكا
</button>


<button onclick="createNumber('🇷🇺 روسيا')">
🇷🇺 روسيا
</button>


<button onclick="createNumber('🇩🇪 ألمانيا')">
🇩🇪 ألمانيا
</button>


<button onclick="createNumber('🇸🇦 السعودية')">
🇸🇦 السعودية
</button>


<button onclick="createNumber('🇯🇴 الأردن')">
🇯🇴 الأردن
</button>


<button onclick="createNumber('🇾🇪 اليمن')">
🇾🇪 اليمن
</button>


<button onclick="createNumber('🇨🇳 الصين')">
🇨🇳 الصين
</button>


<button onclick="createNumber('🇮🇳 الهند')">
🇮🇳 الهند
</button>


<button onclick="createNumber('🇵🇰 باكستان')">
🇵🇰 باكستان
</button>


</div>

</div>





<div class="box">

<div class="balance">

💰 الرصيد:
<span id="balance">
10
</span>

</div>

</div>




<div id="result"></div>





<div class="box">

<h2>
📋 سجل الطلبات
</h2>


<div id="history">

لا يوجد طلبات

</div>


</div>


</div>
<script>

let currentUser="";
let service="";
let currentNumber="";
let balance=10;



// إنشاء حساب

function register(){


let user=document.getElementById("username").value;
let pass=document.getElementById("password").value;


if(user=="" || pass==""){

alert("أدخل اسم المستخدم وكلمة المرور");

return;

}


let users=JSON.parse(localStorage.getItem("users") || "{}");


if(users[user]){

alert("اسم المستخدم موجود مسبقاً");

return;

}



users[user]={

password:pass,
balance:10,
history:"",
lastRequest:0

};


localStorage.setItem("users",JSON.stringify(users));


alert("تم إنشاء الحساب بنجاح");

}




// تسجيل الدخول

function login(){


let user=document.getElementById("username").value;

let pass=document.getElementById("password").value;


let users=JSON.parse(localStorage.getItem("users") || "{}");


if(users[user] && users[user].password==pass){


currentUser=user;


balance=users[user].balance;


document.getElementById("balance").innerHTML=balance;


document.getElementById("history").innerHTML=
users[user].history || "لا يوجد طلبات";


document.getElementById("loginPage").style.display="none";


}

else{

alert("بيانات الدخول غير صحيحة");

}


}





// اختيار التطبيق

function chooseService(s){

service=s;

document.getElementById("serviceBox").style.display="none";

document.getElementById("countryBox").style.display="block";

}




// توليد رقم تجريبي

function randomNumber(country){


let numbers={


"🇺🇸 أمريكا":"+1 "+Math.floor(1000000000+Math.random()*9000000000),


"🇷🇺 روسيا":"+7 "+Math.floor(1000000000+Math.random()*9000000000),


"🇩🇪 ألمانيا":"+49 "+Math.floor(100000000+Math.random()*900000000),


"🇸🇦 السعودية":"+966 5"+Math.floor(10000000+Math.random()*90000000),


"🇯🇴 الأردن":"+962 7"+Math.floor(10000000+Math.random()*90000000),


"🇾🇪 اليمن":"+967 "+Math.floor(100000000+Math.random()*900000000),


"🇨🇳 الصين":"+86 "+Math.floor(10000000000+Math.random()*90000000000),


"🇮🇳 الهند":"+91 "+Math.floor(1000000000+Math.random()*9000000000),


"🇵🇰 باكستان":"+92 3"+Math.floor(10000000+Math.random()*90000000)


};


return numbers[country];


}




// إنشاء طلب رقم

function createNumber(country){


let users=JSON.parse(localStorage.getItem("users") || "{}");


let last=users[currentUser].lastRequest || 0;


let diff=Date.now()-last;



if(diff < 86400000){


let hours=Math.ceil((86400000-diff)/3600000);


alert("يمكنك طلب رقم جديد بعد "+hours+" ساعة");


return;

}



currentNumber=randomNumber(country);



document.getElementById("result").innerHTML=`

<div class="card">

<h2>${service}</h2>

<h3>${country}</h3>


<div class="number">

${currentNumber}

</div>


<button onclick="requestCode()">

📩 طلب الكود

</button>


</div>

`;

}





// طلب الكود

function requestCode(){


let time=60;



document.getElementById("result").innerHTML+=`

<div class="card">

<h2>انتظر وصول الكود</h2>

<div class="timer" id="timer">

60

</div>


</div>

`;



let timer=setInterval(()=>{


time--;


document.getElementById("timer").innerHTML=time;



if(time<=0){


clearInterval(timer);



let code=Math.floor(100000+Math.random()*900000);



document.getElementById("result").innerHTML+=`

<div class="card">

<h2>✅ الكود التجريبي</h2>

<div class="code">

${code}

</div>


</div>

`;



saveData(code);



}


},1000);


}




// حفظ بيانات المستخدم

function saveData(code){


let users=JSON.parse(localStorage.getItem("users") || "{}");


balance--;


users[currentUser].balance=balance;


users[currentUser].lastRequest=Date.now();



users[currentUser].history += `

<div class="history">

الخدمة: ${service}<br>

الرقم: ${currentNumber}<br>

الكود: ${code}

</div>

`;



localStorage.setItem("users",JSON.stringify(users));


document.getElementById("balance").innerHTML=balance;


document.getElementById("history").innerHTML=
users[currentUser].history;


}



</script>


</body>

</html>
