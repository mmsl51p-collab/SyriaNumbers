<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SyriaNumbers</title>

<style>

*{
box-sizing:border-box;
font-family:Tajawal,Arial,sans-serif;
}

body{
margin:0;
background:#050505;
color:white;
min-height:100vh;
}


header{

padding:35px 20px;
text-align:center;
background:
linear-gradient(135deg,#000,#111,#000);

box-shadow:0 0 30px #000;

}


.logo{

font-size:42px;
font-weight:bold;
color:#00e5ff;
text-shadow:0 0 20px #00e5ff;

}


.subtitle{

color:#aaa;
margin-top:10px;

}



.container{

max-width:900px;
margin:auto;
padding:20px;

}



.box{

background:#101010;
border:1px solid #222;
border-radius:25px;
padding:25px;
margin-bottom:20px;
animation:show .5s;

}



@keyframes show{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:none;
}

}



h2{

text-align:center;
color:#00e5ff;

}



.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}



button{

width:100%;
padding:16px;
border-radius:18px;
border:1px solid #333;
background:#181818;
color:white;
font-size:17px;
cursor:pointer;
transition:.3s;

}


button:hover{

background:#00e5ff;
color:#000;
transform:scale(1.03);

}



.card{

background:#080808;
border:1px solid #333;
border-radius:25px;
padding:25px;
text-align:center;

}



.number{

font-size:32px;
color:#00ff88;
direction:ltr;
margin:20px;

}



.code{

font-size:35px;
color:#ffd700;

}



.balance{

color:#00ff88;
font-size:20px;
text-align:center;

}



.history{

background:#151515;
padding:15px;
border-radius:15px;
margin-top:10px;

}



.timer{

font-size:40px;
color:#ffcc00;

}



@media(max-width:600px){

.grid{

grid-template-columns:1fr;

}

.logo{

font-size:32px;

}

}

</style>

</head>


<body>


<header>

<div class="logo">
📱 SyriaNumbers
</div>

<div class="subtitle">
منصة الأرقام التجريبية الذكية
</div>

</header>


<div class="container">
<div class="box" id="serviceBox">

<h2>اختر التطبيق</h2>

<div class="grid">

<button onclick="chooseService('واتساب')">📱 واتساب</button>

<button onclick="chooseService('تيليجرام')">✈️ تيليجرام</button>

<button onclick="chooseService('فيسبوك')">📘 فيسبوك</button>

<button onclick="chooseService('تويتر')">🐦 تويتر</button>

</div>

</div>



<div class="box" id="countryBox" style="display:none">

<h2>اختر الدولة</h2>

<div class="grid">

<button onclick="createNumber('🇺🇸 أمريكا')">🇺🇸 أمريكا</button>

<button onclick="createNumber('🇷🇺 روسيا')">🇷🇺 روسيا</button>

<button onclick="createNumber('🇩🇪 ألمانيا')">🇩🇪 ألمانيا</button>

<button onclick="createNumber('🇸🇦 السعودية')">🇸🇦 السعودية</button>

<button onclick="createNumber('🇯🇴 الأردن')">🇯🇴 الأردن</button>

<button onclick="createNumber('🇾🇪 اليمن')">🇾🇪 اليمن</button>

<button onclick="createNumber('🇨🇳 الصين')">🇨🇳 الصين</button>

<button onclick="createNumber('🇮🇳 الهند')">🇮🇳 الهند</button>

<button onclick="createNumber('🇵🇰 باكستان')">🇵🇰 باكستان</button>

</div>

</div>



<div class="box">

<div class="balance">

💰 الرصيد التجريبي: <span id="balance">10</span>

</div>

</div>



<div id="result"></div>



<div class="box">

<h2>📋 سجل الطلبات</h2>

<div id="history"></div>

</div>



</div>



<script>


let service="";

let currentNumber="";

let balance=10;



function chooseService(s){

service=s;

document.getElementById("serviceBox").style.display="none";

document.getElementById("countryBox").style.display="block";

}




function randomNumber(country){

let numbers={

"🇺🇸 أمريكا":"+1 "+Math.floor(1000000000+Math.random()*9000000000),

"🇷🇺 روسيا":"+7 "+Math.floor(1000000000+Math.random()*9000000000),

"🇩🇪 ألمانيا":"+49 "+Math.floor(100000000+Math.random()*900000000),

"🇸🇦 السعودية":"+966 5"+Math.floor(10000000+Math.random()*90000000),

"🇯🇴 الأردن":"+962 7"+Math.floor(10000000+Math.random()*90000000),

"🇾🇪 اليمن":"+967 "+Math.floor(100000000+Math.random()*900000000),

"🇨🇳 الصين":"+86 "+Math.floor(10000000000+Math.random()*90000000000),

"🇮🇳 الهند":"+91 "+Math.floor(1000000000+Math.random()*9000000000),

"🇵🇰 باكستان":"+92 3"+Math.floor(10000000+Math.random()*90000000)

};

return numbers[country];

}




function createNumber(country){


let last=localStorage.getItem("lastRequest");


if(last){

let diff=Date.now()-last;


if(diff < 86400000){

let hours=Math.ceil((86400000-diff)/3600000);

alert("يمكنك طلب رقم جديد بعد "+hours+" ساعة");

return;

}

}



currentNumber=randomNumber(country);



document.getElementById("result").innerHTML=`

<div class="card">

<h2>${service}</h2>

<h3>${country}</h3>

<div class="number">

${currentNumber}

</div>


<button onclick="requestCode()">

📩 طلب الكود

</button>


</div>

`;

}




function requestCode(){


let time=60;


document.getElementById("result").innerHTML+=`

<div class="card">

<h2>انتظر وصول الكود</h2>

<div class="timer" id="timer">

60

</div>

</div>

`;


let x=setInterval(()=>{


time--;

document.getElementById("timer").innerHTML=time;



if(time<=0){

clearInterval(x);


let code=Math.floor(100000+Math.random()*900000);



document.getElementById("result").innerHTML+=`

<div class="card">

<h2>✅ الكود التجريبي</h2>

<div class="code">

${code}

</div>

<p>

احتفظ بالكود

</p>

</div>

`;



saveHistory(code);


localStorage.setItem("lastRequest",Date.now());


}


},1000);


}



function saveHistory(code){


balance--;

document.getElementById("balance").innerHTML=balance;


let history=localStorage.getItem("history") || "";

history += `

<div class="history">

الخدمة: ${service}<br>

الرقم: ${currentNumber}<br>

الكود: ${code}

</div>

`;

localStorage.setItem("history",history);


document.getElementById("history").innerHTML=history;


}



document.getElementById("history").innerHTML=

localStorage.getItem("history") || "لا يوجد طلبات";



</script>


</body>

</html>
